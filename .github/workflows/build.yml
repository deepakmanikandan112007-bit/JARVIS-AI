
name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build JARVIS Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip ant \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake \
            libffi-dev libssl-dev automake \
            build-essential

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer setuptools wheel
          python -m pip install cython==0.29.34

      - name: Check project files
        run: |
          test -f main.py
          test -f buildozer.spec
          echo "JARVIS files found"

      # Initialize Android SDK
      - name: Initialize Android SDK
        run: |
          set +e
          yes | buildozer android debug \
            > bootstrap.log 2>&1
          echo "SDK initialization attempt completed"
          set -e

      # Accept all Android SDK licenses
      - name: Accept Android SDK Licenses
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          if [ ! -d "$SDK" ]; then
            echo "Android SDK directory not found"
            cat bootstrap.log
            exit 1
          fi

          SDKMANAGER=$(find "$SDK" \
            -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            cat bootstrap.log
            exit 1
          fi

          echo "Using SDK Manager: $SDKMANAGER"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" --licenses

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "build-tools;37.0.0"

      # Build APK
      - name: Build JARVIS APK
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log

      # Upload APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7

      # Upload logs
      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Build-Logs
          path: |
            build.log
            bootstrap.log
          if-no-files-found: ignore
          retention-days: 7
          
