
name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build JARVIS Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip ant \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake \
            libffi-dev libssl-dev automake \
            build-essential

      - name: Verify Apache Ant
        run: |
          ant -version
          test -d /usr/share/ant

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer setuptools wheel
          python -m pip install cython==0.29.34

      - name: Check project files
        run: |
          test -f main.py
          test -f buildozer.spec
          echo "JARVIS project files found"

      - name: Configure Android Ant path
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")
          lines = path.read_text().splitlines()

          result = []
          in_app = False
          ant_found = False

          for line in lines:
              stripped = line.strip()

              if stripped.startswith("[") and stripped.endswith("]"):
                  in_app = stripped == "[app]"

              if in_app and stripped.startswith("android.ant_path"):
                  result.append("android.ant_path = /usr/share/ant")
                  ant_found = True
              else:
                  result.append(line)

          if not ant_found:
              for i, line in enumerate(result):
                  if line.strip() == "[app]":
                      result.insert(i + 1,
                                    "android.ant_path = /usr/share/ant")
                      ant_found = True
                      break

          if not ant_found:
              raise SystemExit("[app] section missing in buildozer.spec")

          path.write_text("\n".join(result) + "\n")
          print("Apache Ant path configured")
          PY

      - name: Build JARVIS APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Build-Log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
          
