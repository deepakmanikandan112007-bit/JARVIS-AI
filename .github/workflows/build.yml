name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev automake

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer setuptools
          python -m pip install cython==0.29.34

      - name: Build APK
        run: |
          set +e
          yes | buildozer android debug 2>&1 | tee build.log
          BUILD_STATUS=${PIPESTATUS[1]}
          echo "Build exit code: $BUILD_STATUS"
          echo "---- BUILD ERRORS ----"
          grep -inE "error:|fatal error:|exception|failed" build.log | tail -40 || true
          exit $BUILD_STATUS

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Build-Log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: bin/*.apk
